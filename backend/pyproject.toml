[project]
name = "cardshop-backend"
version = "0.1.0"
description = "FastAPI backend for the Card Shop storefront"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "oracledb>=2.5",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# The backend is an application, not a library: there is nothing to build or publish,
# so uv manages the environment without installing the project itself.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "S",    # bandit
]
# FastAPI's dependency injection is expressed as function-call defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point of a test

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
# Lets "import app" work without installing the project.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs a reachable Oracle database (deselected by default)",
]
# Unit tests are the default run; integration tests are opt-in.
addopts = "-m 'not integration'"
