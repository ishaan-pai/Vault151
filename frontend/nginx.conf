# Serves the built static site and proxies the API to the backend container, so the
# browser only ever talks to one origin. This is the shape production will keep.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed build assets, none for the entry document.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Card photos, written by the backend into a shared volume.
    location /media/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /api/ {
        # The backend accepts card photos up to 5 MB. nginx defaults to 1 MB, which
        # would reject the upload here with a 413 before it ever reached the app.
        client_max_body_size 6m;

        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: unknown paths are handled by the app, not by nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
